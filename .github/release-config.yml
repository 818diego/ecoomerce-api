name-template: '$RESOLVED_VERSION'  # ya no importa, lo override el workflow
tag-template: '$RESOLVED_VERSION'   # ya no importa, lo override el workflow

change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&'

template: |
  ## What's Changed
  $CHANGES

autolabeler:
  - label: feat
    title:
      - '/^feat(\(.+\))?:/i'
  - label: fix
    title:
      - '/^fix(\(.+\))?:/i'
  - label: docs
    title:
      - '/^docs(\(.+\))?:/i'
  - label: style
    title:
      - '/^style(\(.+\))?:/i'
  - label: refactor
    title:
      - '/^refactor(\(.+\))?:/i'
  - label: perf
    title:
      - '/^perf(\(.+\))?:/i'
  - label: test
    title:
      - '/^test(\(.+\))?:/i'
  - label: build
    title:
      - '/^build(\(.+\))?:/i'
  - label: ci
    title:
      - '/^ci(\(.+\))?:/i'
  - label: chore
    title:
      - '/^chore(\(.+\))?:/i'
  - label: revert
    title:
      - '/^revert(\(.+\))?:/i'
  - label: deps
    title:
      - '/^deps(\(.+\))?:/i'

categories:
  - title: '🚀 Features'
    labels: [feat, feature, enhancement]
  - title: '🐛 Bug Fixes'
    labels: [fix, hotfix]
  - title: '📝 Documentation'
    labels: [docs, documentation]
  - title: '🎨 Style & UI'
    labels: [style]
  - title: '🔄 Refactor'
    labels: [refactor]
  - title: '⚡ Performance'
    labels: [perf, performance]
  - title: '🧪 Tests'
    labels: [test]
  - title: '🏗️ Build System'
    labels: [build]
  - title: '👷 CI'
    labels: [ci]
  - title: '🏠 Chores'
    labels: [chore]
  - title: '⏪ Reversions'
    labels: [revert]
  - title: '📦 Dependencies'
    labels: [deps]

exclude-labels:
  - ignore

version-resolver:
  major:
    labels: [major, breaking]
  minor:
    labels: [feat, feature, enhancement]
  patch:
    labels: [fix, hotfix, docs, style, refactor, perf, test, build, ci, chore]
  default: patch
